services:

  app-manager:
    image: ghcr.io/lucasrtn/codelab-app-manager:latest
    container_name: codelab-app-manager
    restart: unless-stopped

    ports:
      - "9001:9001"

    volumes:
      - codelab-app-manager:/var/lib/codelab/app-manager
      - codelab-config:/var/lib/codelab/config
      - /DATA/AppData/codelab/workspace:/workspace

    environment:
      APP_MANAGER_DIR: /opt/codelab/app-manager
      APP_MANAGER_STATE: /var/lib/codelab/app-manager
      APP_MANAGER_ROOT: /workspace
      MANAGER_PORT: "9001"

    networks:
      - codelab

  dev:
    image: ghcr.io/lucasrtn/codelab-dev:latest
    container_name: codelab-dev
    restart: unless-stopped

    ports:
      - "2222:22"

    volumes:
      - /DATA/AppData/codelab/workspace:/workspace
      - codelab-dev-ssh:/home/vscode/.ssh

    networks:
      - codelab

  dagster:
    build:
      context: .
      dockerfile: dagster/Dockerfile
    container_name: codelab-dagster
    restart: unless-stopped
    environment:
      DAGSTER_HOME: /opt/dagster/home
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/code/workspace.yaml

    ports:
      - "3000:3000"

    volumes:
      - codelab-dagster-home:/opt/dagster/home
      - ./dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./dagster_code:/opt/dagster/code:ro
      - /DATA/AppData/codelab/workspace:/workspace

    networks:
      - codelab

  dagster-daemon:
    build:
      context: .
      dockerfile: dagster/Dockerfile
    container_name: codelab-dagster-daemon
    restart: unless-stopped

    command:
      - dagster-daemon
      - run
      - --workspace
      - /opt/dagster/code/workspace.yaml

    environment:
      DAGSTER_HOME: /opt/dagster/home

    volumes:
      - codelab-dagster-home:/opt/dagster/home
      - ./dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./dagster_code:/opt/dagster/code:ro
      - /DATA/AppData/codelab/workspace:/workspace

    networks:
      - codelab

volumes:
  codelab-app-manager:
  codelab-config:
  codelab-dev-ssh:
  codelab-dagster-home:


networks:
  codelab:
