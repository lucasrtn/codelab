x-casaos:
  architectures:
    - amd64
    - arm64
  author: lucasrtn
  category: Developer
  description:
    en_US: All-in-one dev environment — Postgres, SSH + VS Code, Dagster orchestration and a custom app deployer.
    fr_FR: Environnement de developpement tout-en-un — Postgres, SSH + VS Code, orchestration Dagster et un gestionnaire d'applications.
  icon: "data:image/png;base64,"
  index: /
  main: codelab-app-manager
  port_map: "9001"
  scheme: http
  tagline:
    en_US: Your all-in-one self-hosted dev environment
    fr_FR: Ton environnement de developpement tout-en-un
  title:
    en_US: CodeLab
    fr_FR: CodeLab

services:

  codelab-postgres:
    image: postgres:18
    container_name: codelab-postgres
    restart: unless-stopped

    # Genere le mot de passe Postgres au tout premier demarrage (s'il
    # n'existe pas deja dans le volume partage), puis rend la main a
    # l'entrypoint officiel de l'image. Evite d'avoir un conteneur
    # d'initialisation a part, qui apparaissait comme un dossier AppData
    # distinct dans ZimaOS sans y avoir sa place.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /var/lib/codelab/config
        if [ ! -s /var/lib/codelab/config/postgres_password ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /var/lib/codelab/config/postgres_password
          echo "[codelab-postgres] mot de passe genere."
        fi
        chmod 600 /var/lib/codelab/config/postgres_password

        # Recopie les identifiants dans un fichier consolide, lisible
        # directement depuis /DATA/AppData/codelab/config/credentials.env sur
        # le disque du ZimaOS, aucun "docker exec" necessaire. Pas de nom en
        # "." (fichier cache sous Unix) : le navigateur de fichiers ZimaOS
        # n'offre pas d'option pour afficher les fichiers caches.
        #
        # Remplacement par BLOC entier (commentaires inclus), delimite par
        # des marqueurs "# ===== NOM_DU_SERVICE =====" / "# ===== /NOM_DU_SERVICE =====" --
        # pas juste par prefixe de cle, sinon les commentaires documentant
        # chaque service s'accumuleraient en double a chaque redemarrage.
        # Chaque service ne touche qu'a son propre bloc, les autres restent
        # intacts quel que soit l'ordre de demarrage.
        ENV_FILE=/var/lib/codelab/config/credentials.env
        touch "$$ENV_FILE"

        upsert_block() {
          name="$$1"; content="$$2"
          awk -v s="# ===== $$name =====" -v e="# ===== /$$name =====" \
            '$$0==s{skip=1} !skip{print} $$0==e{skip=0}' "$$ENV_FILE" > "$$ENV_FILE.tmp"
          {
            cat "$$ENV_FILE.tmp"
            echo "# ===== $$name ====="
            printf '%s\n' "$$content" | sed 's/^[[:space:]]*//'
            echo "# ===== /$$name ====="
          } > "$$ENV_FILE.new"
          mv "$$ENV_FILE.new" "$$ENV_FILE"
          rm -f "$$ENV_FILE.tmp"
        }

        upsert_block "codelab-header" "# credentials.env -- identifiants CodeLab, generes et geres
        # automatiquement par chaque service au demarrage. Ne pas editer a la
        # main : chaque bloc ci-dessous est entierement reecrit a chaque
        # redemarrage du conteneur concerne. Permissions 600 -- lisible
        # uniquement par root sur le disque du ZimaOS."

        upsert_block "codelab-postgres" "# Base de donnees partagee par tous les services CodeLab.
        # Utilise par : codelab-dev, codelab-dagster, codelab-dagster-daemon.
        POSTGRES_HOST=codelab-postgres
        POSTGRES_PORT=5432
        POSTGRES_DB=codelab
        POSTGRES_USER=codelab
        POSTGRES_PASSWORD=$$(cat /var/lib/codelab/config/postgres_password)"

        upsert_block "codelab-dagster" "# codelab-dagster (interface :3000) et codelab-dagster-daemon
        # n'ont pas d'identifiant separe : ils utilisent cette meme base
        # Postgres pour stocker runs, logs d'evenements et planifications
        # (voir dagster/dagster.yaml). Variables telles que lues par ces
        # deux conteneurs (DAGSTER_PG_*, valeurs identiques a POSTGRES_*
        # ci-dessus).
        DAGSTER_PG_HOST=codelab-postgres
        DAGSTER_PG_PORT=5432
        DAGSTER_PG_DB=codelab
        DAGSTER_PG_USER=codelab
        DAGSTER_PG_PASSWORD=$$(cat /var/lib/codelab/config/postgres_password)"

        upsert_block "codelab-dev" "# Pas de mot de passe : l'acces SSH (port 2222) se fait uniquement par
        # cle publique (variable SSH_PUBLIC_KEY, saisie a l'installation).
        # Les cles hote SSH (identite du serveur, pas un mot de passe) sont
        # persistees dans /DATA/AppData/codelab/dev-host-keys -- sensibles,
        # ne jamais les partager, mais rien a documenter ici."

        chmod 600 "$$ENV_FILE"

        exec docker-entrypoint.sh postgres

    environment:
      POSTGRES_DB: codelab
      POSTGRES_USER: codelab
      # Lu nativement par l'image officielle postgres au demarrage.
      POSTGRES_PASSWORD_FILE: /var/lib/codelab/config/postgres_password

    volumes:
      # Chemin par defaut : /DATA/AppData/codelab/postgres.
      # ZimaOS affiche ce chemin comme un champ modifiable a l'installation
      # (les volumes ${VAR} font echouer son parseur -> chemin litteral
      # obligatoire ici, personnalisation via l'ecran d'install ZimaOS).
      - /DATA/AppData/codelab/postgres:/var/lib/postgresql
      # Pas ":ro" ici : c'est ce service qui ecrit le mot de passe. Les
      # 4 autres services (dev, dagster, dagster-daemon) le montent en
      # lecture seule plus bas.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelab -d codelab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - codelab


  codelab-dev:
    image: ghcr.io/lucasrtn/codelab-dev:latest
    container_name: codelab-dev
    restart: unless-stopped

    ports:
      - "2222:22"

    environment:
      SSH_PUBLIC_KEY: ${SSH_PUBLIC_KEY}
      PGHOST: codelab-postgres
      PGPORT: "5432"
      PGDATABASE: codelab
      PGUSER: codelab
      PGPASSWORD_FILE: /var/lib/codelab/config/postgres_password

    volumes:
      # Chemin par defaut : /DATA/AppData/codelab/workspace. Personnalisable
      # dans l'ecran d'install ZimaOS. Doit rester identique sur les 4
      # services qui le montent (dev, dagster, dagster-daemon, app-manager).
      - /DATA/AppData/codelab/workspace:/workspace
      - /DATA/AppData/codelab/dev-ssh:/home/vscode/.ssh
      - /DATA/AppData/codelab/dev-host-keys:/etc/ssh/host_keys
      - /DATA/AppData/codelab/config:/var/lib/codelab/config:ro

    # Pas de "depends_on: codelab-postgres: condition: service_healthy" ici,
    # volontairement -- observe a plusieurs reprises que ZimaOS laisse ce
    # conteneur a l'etat "Created" (jamais demarre) si Postgres met un peu
    # de temps a devenir "healthy" au moment de l'installation. codelab-dev
    # n'a pas besoin que Postgres soit deja pret a cet instant precis : les
    # identifiants sont lus depuis un fichier au demarrage, et une vraie
    # connexion a la base n'est necessaire que lorsque l'utilisateur s'en
    # sert depuis une session SSH, pas au boot du conteneur lui-meme.

    x-casaos:
      envs:
        - container: SSH_PUBLIC_KEY
          description:
            en_US: "Your public SSH key (contents of e.g. ~/.ssh/id_ed25519.pub) to connect as the 'vscode' user."
            fr_FR: "Ta cle publique SSH (contenu de ~/.ssh/id_ed25519.pub par exemple) pour te connecter en tant qu'utilisateur 'vscode'."

    networks:
      - codelab


  codelab-dagster:
    image: ghcr.io/lucasrtn/codelab-dagster:latest
    container_name: codelab-dagster
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DAGSTER_HOME: /opt/dagster/home
      PYTHONUNBUFFERED: "1"
      # Permet a "-m definitions" de resoudre /workspace/definitions.py
      # (monte en volume) plutot que la copie embarquee dans l'image.
      PYTHONPATH: /workspace
      DAGSTER_PG_HOST: codelab-postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_DB: codelab
      DAGSTER_PG_USER: codelab
      DAGSTER_PG_PASSWORD_FILE: /var/lib/codelab/config/postgres_password

    volumes:
      - /DATA/AppData/codelab/dagster-home:/opt/dagster/home
      - /DATA/AppData/codelab/workspace:/workspace
      - /DATA/AppData/codelab/config:/var/lib/codelab/config:ro

    depends_on:
      codelab-postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - codelab


  codelab-dagster-daemon:
    image: ghcr.io/lucasrtn/codelab-dagster:latest
    container_name: codelab-dagster-daemon
    restart: unless-stopped

    command:
      - dagster-daemon
      - run
      - -m
      - definitions

    environment:
      DAGSTER_HOME: /opt/dagster/home
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace
      DAGSTER_PG_HOST: codelab-postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_DB: codelab
      DAGSTER_PG_USER: codelab
      DAGSTER_PG_PASSWORD_FILE: /var/lib/codelab/config/postgres_password

    volumes:
      - /DATA/AppData/codelab/dagster-home:/opt/dagster/home
      - /DATA/AppData/codelab/workspace:/workspace
      - /DATA/AppData/codelab/config:/var/lib/codelab/config:ro

    depends_on:
      codelab-postgres:
        condition: service_healthy

    networks:
      - codelab


  codelab-app-manager:
    image: ghcr.io/lucasrtn/codelab-app-manager:latest
    container_name: codelab-app-manager
    restart: unless-stopped

    ports:
      - "9001:9001"

    volumes:
      - /DATA/AppData/codelab/app-manager:/var/lib/codelab/app-manager
      - /DATA/AppData/codelab/workspace:/workspace
      # Lecture-ecriture (pas ":ro") : ce service ajoute sa propre ligne
      # dans le credentials.env consolide partage avec codelab-postgres.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config

    environment:
      APP_MANAGER_DIR: /opt/codelab/app-manager
      APP_MANAGER_STATE: /var/lib/codelab/app-manager
      APP_MANAGER_ROOT: /workspace
      MANAGER_PORT: "9001"
      APP_MANAGER_SHARED_CONFIG: /var/lib/codelab/config

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - codelab


networks:
  codelab:
    name: codelab_codelab
