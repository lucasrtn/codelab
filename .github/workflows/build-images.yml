name: Build & Push CodeLab images

# Reconstruit les 3 images des lors qu'un de leurs dossiers, ou le compose,
# change sur main. "workflow_dispatch" permet aussi un rebuild manuel
# (utile apres un simple changement de tag de version Dagster, etc.).
on:
  push:
    branches: [main]
    paths:
      - "dev/**"
      - "dagster/**"
      - "app-manager/**"
      - "docker-compose.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codelab-dev
            dockerfile: dev/Dockerfile
          - name: codelab-dagster
            dockerfile: dagster/Dockerfile
          - name: codelab-app-manager
            dockerfile: app-manager/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU (pour les builds arm64 sur runner amd64)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadonnees / tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Contexte = racine du repo : les Dockerfiles font
      # "COPY dev/requirements.txt", "COPY dagster/definitions.py", etc.,
      # des chemins relatifs a la racine, pas a leur propre dossier.
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
