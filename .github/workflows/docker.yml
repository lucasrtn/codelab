name: Build CodeLab App Manager

on:
  push:
    branches:
      - main
    paths:
      - "app-manager/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app-manager
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/codelab-app-manager:latest
            ghcr.io/${{ github.repository_owner }}/codelab-app-manager:${{ github.sha }}
