name: Build and publish Codelab images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/lucasrtn

jobs:

  app-manager:
    name: Build app-manager
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app-manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app-manager/Dockerfile
          push: true
          tags: |
            ghcr.io/lucasrtn/codelab-app-manager:latest
            ghcr.io/lucasrtn/codelab-app-manager:${{ github.sha }}


  dev:
    name: Build dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/Dockerfile
          push: true
          tags: |
            ghcr.io/lucasrtn/codelab-dev:latest
            ghcr.io/lucasrtn/codelab-dev:${{ github.sha }}


  dagster:
    name: Build Dagster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Dagster
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dagster/Dockerfile
          push: true
          tags: |
            ghcr.io/lucasrtn/codelab-dagster:latest
            ghcr.io/lucasrtn/codelab-dagster:${{ github.sha }}
